model:
  architecture: dense_core_sparse_edge
  hidden_size: 64
  num_layers: 4
  num_attention_heads: 4
  intermediate_size: 128
  vocab_size: 512
  max_position_embeddings: 128
  attention:
    type: dense
  ffn:
    type: dense_core_sparse_edge
    placement: edge_moe
    front_moe_layers: 1
    back_moe_layers: 1
  moe:
    num_experts: 4
    top_k: 2
    shared_expert: true
    expert_intermediate_size: 64
    router_aux_loss_coef: 0.01
    capacity_factor: 1.25
    router_jitter_noise: 0.0
    drop_tokens: false
