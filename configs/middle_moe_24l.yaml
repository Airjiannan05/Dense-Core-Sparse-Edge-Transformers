model:
  architecture: dense_core_sparse_edge
  hidden_size: 768
  num_layers: 24
  num_attention_heads: 12
  intermediate_size: 3072
  vocab_size: 32000
  max_position_embeddings: 2048
  attention:
    type: dense
  ffn:
    type: dense_core_sparse_edge
    placement: middle_moe
    n_moe_layers: 10
  moe:
    num_experts: 8
    top_k: 2
    shared_expert: true
    expert_intermediate_size: 1536
    router_aux_loss_coef: 0.01
    capacity_factor: 1.25
    router_jitter_noise: 0.0
    drop_tokens: false
